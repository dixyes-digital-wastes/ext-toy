name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    name: Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf automake build-essential pkg-config

      - name: Build
        run: |
          phpize
          ./configure --enable-toy
          make -j"$(nproc)"

      - name: Run tests
        run: make test TESTS=tests

  macos:
    name: macOS
    # The arm64 runner has no ISA detection, so the kernel tests fail there.
    # The Intel runner keeps them meaningful
    runs-on: macos-26-intel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none

      - name: Install build dependencies
        run: brew install autoconf automake pkg-config

      - name: Build
        run: |
          phpize
          ./configure --enable-toy
          make -j"$(sysctl -n hw.ncpu)"

      - name: Run tests
        run: make test TESTS=tests

  windows:
    name: Windows
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Check out PHP source
        uses: actions/checkout@v7
        with:
          repository: php/php-src
          ref: PHP-8.5
          path: build/php-src

      - name: Check out Toy source
        uses: actions/checkout@v7
        with:
          repository: dixyes-digital-wastes/ext-toy
          ref: ${{ github.sha }}
          path: build/php-src/ext/toy

      - name: Check out the PHP build tools
        uses: actions/checkout@v7
        with:
          repository: php/php-sdk-binary-tools
          ref: master
          path: php-sdk-binary-tools

      - name: Build
        shell: cmd
        working-directory: build/php-src
        run: call "%GITHUB_WORKSPACE%\php-sdk-binary-tools\phpsdk-starter.bat" -c vs18 -a x64 -t %GITHUB_WORKSPACE%\windows-toy-build.bat

      - name: Check the build output
        shell: pwsh
        run: |
          $dir = Join-Path $PWD "build/php-src/x64/Release_TS"
          foreach ($name in 'php.exe', 'php_toy.dll') {
            $path = Join-Path $dir $name
            if (-not (Test-Path $path)) { throw "missing build output: $path" }
            Get-Item $path | Select-Object FullName, Length
          }

      - name: Run tests
        shell: pwsh
        run: |
          $dir = Join-Path $PWD "build/php-src/x64/Release_TS"
          & (Join-Path $dir 'php.exe') -n -d extension_dir="$dir" -d extension=php_toy.dll tests/manual/tensor_test.php
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
